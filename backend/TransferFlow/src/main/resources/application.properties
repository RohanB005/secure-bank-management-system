# --- Server ---
# NOTE: bank-account-service runs on 8082 — this must be a different port.
server.port=8083

# --- Account Service integration (WebClient base URL) ---
# The Transaction Service NEVER accesses the Account table directly —
# all account reads/writes go through this URL via AccountClient.

account.service.url=${ACCOUNT_SERVICE_URL:http://localhost:8082}

# --- MySQL ---

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bankmanagementdb}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
